<script type="module">
/* Unit tests against src/js/* directly, importing the real modules rather than
   driving the app through the DOM (that's smoke.html/golden.html/crud.html).
   Milestone 6 (docs/plan.md) left this near-empty on purpose — Milestone 8 pays
   that back now that the whole app has been through the module split. What's
   here proves things the DOM harnesses can't reach directly:
     - the modules are genuinely importable as ES modules from outside the app
       shell, not just reachable from index.html;
     - the module graph the split produced has no import cycle — the plan's own
       warning is that a cycle fails at boot with an undefined binding, not at
       the call site, so it's worth catching by inspection too;
     - buildViewModel()'s arithmetic, called directly rather than inferred from
       rendered HTML (the "direct view-model check" Milestone 4 deferred, since
       buildViewModel() was still sealed inside app.js's IIFE at that point);
     - the small pure helpers (gainClass, statCard, tabBar, dataTable, parseEnv)
       at the boundary values a screen walk wouldn't necessarily land on. */

import { esc, fmtMoney, fmtEGP, formatAmountDisplay, parseEnv } from '../src/js/format.js';
import { TAG_SPENDING, ENTITIES } from '../src/js/constants.js';
import { state } from '../src/js/state.js';
import { computeLedger, toFieldRequired, buildViewModel, gainClass } from '../src/js/model.js';
import { tabBar, statCard, dataTable } from '../src/js/views/helpers.js';
import {
  parseGoldApiPrice, parseAlphaVantageQuote, parseFxRate,
  isoDateFromUnixSeconds, isoDateFromDateString,
} from '../src/js/marketData.js';

window.__errors = [];
window.onerror = function (m, s, l, c) { window.__errors.push('ERROR: ' + m + ' @' + l + ':' + c); };
window.addEventListener('unhandledrejection', function (e) {
  window.__errors.push('REJECT: ' + ((e.reason && e.reason.message) || e.reason));
});

var log = [];
var failures = 0;
function check(name, actual, expected) {
  var ok = String(actual) === String(expected);
  if (!ok) failures++;
  log.push((ok ? '  pass  ' : '  FAIL  ') + name + (ok ? ' = ' + actual : ' — expected ' + expected + ', got ' + actual));
}
function note(text) { log.push('        ' + text); }
function section(text) { log.push('\n' + text); }

section('modules import cleanly (src/js/* as real ES modules)');
check('format.js: esc escapes <', esc('<'), '&lt;');
check('format.js: fmtMoney formats', fmtMoney(1234.5), '$1,234.50');
check('format.js: formatAmountDisplay inserts commas', formatAmountDisplay('1234567'), '1,234,567');
check('constants.js: TAG_SPENDING', TAG_SPENDING, 'Spending');
check('constants.js: ENTITIES covers the 8 descriptor-driven entities', Object.keys(ENTITIES).length, 8);
check('constants.js: transactions.after was patched in by actions.js', typeof ENTITIES.transactions.after, 'undefined');
note('(ENTITIES.transactions.after stays unset until actions.js is imported — see the comment on the descriptor)');
check('state.js: state starts disconnected', state.connected, false);
check('model.js: computeLedger on no transactions', computeLedger('Acct', []).length, 0);

check('gainClass: custom pair, negative side', gainClass(-5, 'c-gain', 'c-loss'), 'c-loss');
check('gainClass: custom pair, zero side', gainClass(0, 'c-gain', 'c-loss'), 'c-gain');

/* ------------------------------------------------------------ parseEnv --- */

section('parseEnv: comments, padding, quotes, a missing "="');

/* ---------------------------------------------------------- marketData --- */

section('marketData.js: isoDateFromUnixSeconds / isoDateFromDateString');

/* ------------------------------------------------------- buildViewModel --- */

/* certificatesModel measures days-to-maturity against the real wall clock
   (`new Date()`), which a byte-exact expectation can't depend on without going
   stale the next calendar day. Freezing the global Date constructor for the
   duration of this section — restored in `finally` — pins "today" without
   touching model.js: every call site in this codebase only ever does
   `new Date()` or `new Date(someString)`, so a real Date instance built from
   RealDate covers both without needing a full Date polyfill. */
function withFrozenDate(isoDate, fn) {
  var RealDate = window.Date;
  function FrozenDate(arg) {
    return arguments.length === 0 ? new RealDate(isoDate) : new RealDate(arg);
  }
  window.Date = FrozenDate;
  try { return fn(); } finally { window.Date = RealDate; }
}

section('buildViewModel(): per-domain builders against a frozen state fixture');

/* A snapshot of every state.js key, so this fixture can be undone afterwards —
   state is a module-scoped singleton, and nothing downstream in this file
   should see it in a fixture shape. Every value in state.js is plain data
   (strings/numbers/arrays/plain objects), so a JSON round-trip clones it. */
var stateSnapshot = JSON.parse(JSON.stringify(state));

state.accounts = ['Checking', 'Savings'];
state.accountOwners = { Checking: 'Alex', Savings: 'Alex' };
state.accountTags = { Checking: 'Spending', Savings: 'Saving > Other' };

  { Date: '2026-01-10', Amount: 200, Description: 'Transfer to savings', 'Transaction Type': 'Transfer', 'From Account': 'Checking', 'To Account': 'Savings' },
];

];

state.providentFund = { Balance: 20000, 'As Of': '2026-01-01', Tag: 'Saving > Other' };

state.planItems = [{ Step: '1', Item: 'Consolidate accounts', Status: 'Done', Notes: '', Version: 'v1' }];
state.activeSheet = 'dashboard';

/* try/finally so a bug in the fixture reports as a normal FAIL rather than an

try {
withFrozenDate('2026-01-15', function () {

  note('buildViewModel() is pure: same state, called twice, identical output');
  var v2 = buildViewModel();
  check('buildViewModel: purity — no shared intermediate mutated between calls', JSON.stringify(v2) === JSON.stringify(v), true);

  note('ledgerModel: only populated when activeSheet is the account: pseudo-screen');
  state.activeSheet = 'account:Checking';
  var v3 = buildViewModel();
  check('ledgerModel: current balance is the last ledger row\'s running balance', v3.ledgerCurrentBalanceDisplay, fmtMoney(800));
  check('ledgerModel: rows are newest first', v3.ledgerRows[0].date, '2026-01-10');
  check('ledgerModel: newest row type/class for a debit', v3.ledgerRows[0].typeClass, 'type-out');
  check('ledgerModel: owner comes from accountOwners', v3.ledgerOwnerDisplay, 'Alex');

} catch (e) {

} finally {
  /* Undo the fixture regardless of whether the checks above passed. */
  Object.keys(stateSnapshot).forEach(function (k) { state[k] = stateSnapshot[k]; });
}

/* ------------------------------------------------- no import cycles --- */

section('no import cycles across src/js/*.js');

/* Paths relative to src/ — one entry per module file this milestone created.
   A file missing from this list just won't be checked; it won't produce a
   false pass or fail. */
var MODULE_FILES = [
  'app.js',
  'js/format.js', 'js/constants.js', 'js/state.js', 'js/sheets.js', 'js/marketData.js', 'js/model.js',
  'js/views.js', 'js/actions.js',
  'js/views/helpers.js', 'js/views/sidebar.js', 'js/views/settings.js', 'js/views/dashboard.js',
  'js/views/lists.js', 'js/views/plan.js', 'js/views/transactions.js', 'js/views/gold.js',
  'js/views/certs.js', 'js/views/stocks.js', 'js/views/provident-fund.js', 'js/views/prices.js',
  'js/views/ledger.js',
];

function resolveSpec(baseFile, spec) {
  var parts = baseFile.split('/');
  parts.pop(); // directory of baseFile
  spec.split('/').forEach(function (p) {
    if (p === '.' || p === '') return;
    if (p === '..') parts.pop();
    else parts.push(p);
  });
  return parts.join('/');
}

Promise.all(MODULE_FILES.map(function (f) {
  return fetch('../src/' + f).then(function (res) { return res.text(); }).then(function (text) { return [f, text]; });
})).then(function (entries) {
  var graph = {};
  entries.forEach(function (entry) {
    var file = entry[0];
    var noComments = entry[1].replace(/\/\*[\s\S]*?\*\//g, '');
    var re = /(?:^|\s)(?:import|export)\s+[^'";]*from\s+['"]([^'"]+)['"]/g;
    var edges = [];
    var m;
    while ((m = re.exec(noComments))) edges.push(resolveSpec(file, m[1]));
    graph[file] = edges;
  });

  var totalEdges = Object.keys(graph).reduce(function (sum, f) { return sum + graph[f].length; }, 0);
  check('module graph was parsed (edges found)', totalEdges > 0, true);

  var WHITE = 0, GRAY = 1, BLACK = 2;
  var color = {};
  Object.keys(graph).forEach(function (f) { color[f] = WHITE; });
  var cyclePath = null;

  function visit(node, path) {
    if (cyclePath) return;
    color[node] = GRAY;
    path.push(node);
    (graph[node] || []).forEach(function (next) {
      if (cyclePath) return;
      if (!(next in graph)) return; // outside the tracked set (shouldn't happen)
      if (color[next] === GRAY) { cyclePath = path.concat(next); return; }
      if (color[next] === WHITE) visit(next, path);
    });
    path.pop();
    color[node] = BLACK;
  }
  Object.keys(graph).forEach(function (f) { if (color[f] === WHITE) visit(f, []); });

  check('module graph is acyclic', cyclePath ? cyclePath.join(' -> ') : '(none)', '(none)');
  if (cyclePath) note('cycle: ' + cyclePath.join(' -> '));
}).then(function () {
  finish();
}).catch(function (e) {
  failures++;
  log.push('  FAIL  import-cycle check threw: ' + (e && e.message || e));
  finish();
});

function finish() {
  document.getElementById('report').innerHTML =
    (failures === 0 ? '<span class="pass">ALL CHECKS PASSED</span>' : '<span class="fail">' + failures + ' CHECK(S) FAILED</span>')
    + '\n' + (window.__errors.length
      ? '<span class="fail">JS errors: ' + window.__errors.join('; ') + '</span>'
      : '<span class="pass">no JS errors</span>')
    + '\n' + log.join('\n').replace(/  FAIL /g, '  <span class="fail">FAIL</span> ');
}
</script>
</body>
</html>
